[project]
name = "tread"
version = "0.1.0"
description = "TREAD: Token Routing for Efficient Architecture-agnostic Diffusion Training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "hydra-core",
    "omegaconf",
    "accelerate",
    "wandb",
    "diffusers",
    "transformers",
    "deepspeed",
    "webdataset",
    "pillow",
    "numpy",
    "scipy",
    "click",
    "tqdm",
    "timm",
    "setuptools",
    "lmdb>=1.7.5",
    "mosaicml-streaming",
    "hf_transfer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
